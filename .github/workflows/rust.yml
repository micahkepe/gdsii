name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    # --all-targets so tests, examples and benches are linted too. Without it
    # only the lib is checked, and a breaking API change can leave an example
    # uncompilable while CI stays green.
    - name: Run Clippy
      run: cargo clippy --all-targets --verbose -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    # Broken intra-doc links are only warnings, so they need promoting to
    # errors to be caught. cargo doc takes no trailing rustdoc args, hence
    # RUSTDOCFLAGS.
    - name: Check documentation
      run: cargo doc --no-deps --verbose
      env:
        RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --verbose

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
